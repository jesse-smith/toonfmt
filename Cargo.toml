[package]
name = "toonfmt"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.102"
async-trait = "0.1.89"
json5 = "1.3.1"
sha2 = "0.10.9"
reqwest = { version = "0.13.4", default-features = false }
rmcp = { version = "1.7.0", default-features = false, features = ["client", "transport-streamable-http-client-reqwest", "reqwest", "auth"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = { version = "1.0.150", features = ["preserve_order"] }
tokio = { version = "1.52.3", features = ["rt-multi-thread", "process", "io-util", "macros", "sync", "io-std"] }
toon-format = { version = "0.5.0", default-features = false }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }
url = "2.5.8"
