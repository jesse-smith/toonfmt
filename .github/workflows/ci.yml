name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6

      - uses: actions-rust-lang/setup-rust-toolchain@v1
        with:
          components: clippy, llvm-tools-preview

      # `-D warnings` makes the crate-root `#![warn(clippy::cognitive_complexity)]`
      # (threshold 20, set in clippy.toml) a blocking gate alongside every other lint.
      - name: Clippy
        run: cargo clippy --all-targets -- -D warnings

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      # Coverage doubles as the test run. We measure the *coverable surface*:
      # `src/main.rs` (the composition root — wiring + the platform browser spawn) is
      # excluded as inherently un-unit-testable (see plans/2026-06-03-coverage-quality.md).
      - name: Tests with coverage
        run: cargo llvm-cov --ignore-filename-regex 'src/main\.rs' --codecov --output-path codecov.json

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v5
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: codecov.json
          # false: the upload is best-effort telemetry, not a correctness gate. The
          # codecov-action wrapper periodically fails importing Codecov's PGP key from
          # keybase (codecov-action#1876 — "Total number processed: 0" → "Can't check
          # signature: No public key"), an EXTERNAL flake that must not redden CI. This
          # flag scopes ONLY to this step; Clippy/Tests above keep their own exit codes
          # and still fail the job on a real regression. Coverage *drops* are gated
          # server-side in codecov.yml (status.project), which fails OPEN
          # (if_not_found/if_error: success) when a flaky upload never lands.
          fail_ci_if_error: false
